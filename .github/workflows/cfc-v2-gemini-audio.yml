name: cfc-v2-gemini-audio

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/thinkstackdm/thiaaaa-render:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --shm-size=2g --user root
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.1-flash-tts-preview
      VOICE_NAME: Kore
      SCENE_PAUSE_SECONDS: "30"
      MAX_RATE_RETRIES: "5"
    steps:
      - uses: actions/checkout@v4

      - name: Generate Cashflow Compass V2 scene WAVs with Gemini (paced + quota-aware)
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GEMINI_API_KEY:-}" || { echo "GEMINI_API_KEY is not set"; exit 1; }
          mkdir -p _audio_out _work

          cat > _work/scenes.json <<'JSON'
          [
            {"file":"scene-01.wav","text":"Your employer matched five thousand dollars last year. Then you took a better job two years in. How much of that match did you actually keep? The answer depends on a vesting schedule almost nobody reads. This video is generalized financial mechanics for education only, not personalized financial, tax, or investment advice. This narration is AI generated and reviewed by the Cashflow Compass editorial team."},
            {"file":"scene-02.wav","text":"Every 401(k) match starts with a formula. A dollar for dollar match up to four percent of salary means that on eighty thousand dollars, three thousand two hundred dollars contributed by you can unlock three thousand two hundred dollars from the employer. A partial match, like fifty cents on the dollar up to six percent, gives two thousand four hundred dollars on the same salary. A tiered formula might match all of the first three percent and half of the next two percent. The formula tells you the ceiling. Vesting tells you whether you own it."},
            {"file":"scene-03.wav","text":"Vesting is the timeline for legal ownership of employer contributions. Your own contributions are always yours. Employer contributions can be subject to the plan's schedule. In a cliff schedule, you may own zero percent until a date, then one hundred percent after that date. Federal ERISA rules set a maximum three year cliff for this kind of schedule. In a graded schedule, ownership builds gradually. A common six year graded structure is zero percent after year one, twenty percent after year two, forty percent after year three, and so on until one hundred percent. Employers can be more generous, including immediate vesting. The legal source to check is the Summary Plan Description."},
            {"file":"scene-04.wav","text":"Here is the edge case that catches people who front load. Suppose the plan matches fifty cents on the dollar up to six percent of pay. You earn one hundred twenty thousand dollars, so the full year match potential is three thousand six hundred dollars. If you spread contributions all year, every paycheck can earn a match. If you max out by June, some plans stop matching from July through December because you are no longer contributing. A true up provision fixes that at year end. Without a true up, the lost second half match can be real money. Look in the plan document under employer matching contributions and timing."},
            {"file":"scene-05.wav","text":"Now run the match and leave math. An employee earns seventy five thousand dollars. The plan matches fifty percent up to six percent of salary, so the maximum employer match is two thousand two hundred fifty dollars per year. Under a six year graded schedule, after year one the vested amount is zero. After year two, the employer has contributed four thousand five hundred dollars, but twenty percent vested means the employee owns nine hundred dollars. Leave at that point and the other three thousand six hundred dollars is forfeited. Bureau of Labor Statistics tenure data shows that younger workers often change jobs before long vesting schedules finish. When comparing offers, the headline match is not the full story. The ownership timeline matters."},
            {"file":"scene-06.wav","text":"After you leave an employer and confirm the vested balance, there are four common paths. You can leave the money in the old plan if the balance is large enough. You can roll it into a new employer's plan if that plan accepts rollovers. You can do a direct trustee to trustee IRA rollover. Or you can take a cash distribution, which can trigger ordinary income tax and a ten percent early withdrawal penalty if you are under fifty nine and a half. The sixty day indirect rollover rule is strict. If a check is issued to you, the plan withholds twenty percent, and you must redeposit the full pre withholding amount within sixty calendar days to avoid tax treatment."},
            {"file":"scene-07.wav","text":"The recap is simple. First, know the match formula: how much your employer adds per dollar and the salary percentage cap. Second, know the vesting schedule: what percentage of employer money you own today. Third, know the next vesting inflection point: the cliff date or graded milestone that changes the math. This is still generalized mechanics, not advice about what you personally should do. Your plan terms, taxes, age, account options, and job situation can change the result. Read the Summary Plan Description and consult a qualified professional when the decision is specific to you."},
            {"file":"scene-08.wav","text":"If you do not have a brokerage or IRA yet, Fidelity is linked in the description. If you have an old 401(k) you have not rolled over, Capitalize is linked as a rollover concierge service. Affiliate disclosure: links in the description may be affiliate links, and we may earn a commission if you open an account through them at no additional cost to you. This is Cashflow Compass: source cited money mechanics, no gurus. This narration is AI generated, and the content is written and reviewed by the Cashflow Compass editorial team."}
          ]
          JSON

          # Pacing rationale (TSM-3683): Gemini free tier = 10 requests/day, ~2/min.
          # 8 scenes fit the daily cap with margin, but ONLY if calls are paced under
          # the per-minute rate. We also distinguish PerDay 429 (fatal, give up — the
          # daily cap will not recover in-job) from PerMinute 429 (back off + retry).
          decode_scene() {
            local base="$1"
            python3 -c 'import base64,json,pathlib,sys; doc=json.loads(pathlib.Path(sys.argv[1]).read_text()); parts=doc.get("candidates",[{}])[0].get("content",{}).get("parts",[]); audio=next((p.get("inlineData",{}) for p in parts if "inlineData" in p), None); payload=(audio or {}).get("data"); assert payload, "Gemini response missing inlineData payload"; pad="="*(-len(payload)%4); dec=base64.urlsafe_b64decode if any(c in payload for c in "-_") else base64.b64decode; pathlib.Path(sys.argv[2]).write_bytes(dec(payload+pad))' "_work/${base}.json" "_work/${base}.pcm"
          }

          gen_scene() {
            local file="$1" text="$2"
            local base="${file%.wav}"
            local json
            json=$(jq -n \
              --arg text "[calm, authoritative, measured, neutral US English financial explainer voice, read exactly as written]\n$text" \
              --arg model "$GEMINI_MODEL" \
              --arg voice "$VOICE_NAME" \
              '{contents:[{parts:[{text:$text}]}],generationConfig:{responseModalities:["AUDIO"],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:$voice}}}},model:$model}')
            local attempt=1 code msg quota wait
            while :; do
              code=$(curl -sS -o "_work/${base}.json" -w '%{http_code}' \
                "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent" \
                -H "x-goog-api-key: ${GEMINI_API_KEY}" \
                -H "Content-Type: application/json" \
                -X POST -d "$json" || echo "000")
              if [ "$code" = "200" ] && jq -e '.candidates[0].content.parts[]?.inlineData.data' "_work/${base}.json" >/dev/null 2>&1; then
                echo "  $file: HTTP 200, audio payload present"
                return 0
              fi
              msg=$(jq -r '.error.message // "no error.message in body"' "_work/${base}.json" 2>/dev/null || echo "non-JSON body")
              echo "  $file: attempt ${attempt} failed (HTTP ${code}) -> ${msg}"
              if [ "$code" = "429" ]; then
                quota=$(jq -r '[.error.details[]?|.violations[]?|.quotaId] | join(",")' "_work/${base}.json" 2>/dev/null || echo "")
                if printf '%s %s' "$quota" "$msg" | grep -qiE 'PerDay|per day'; then
                  echo "  $file: FATAL — daily free-tier quota exhausted (will not recover in-job). quotaId=${quota}"
                  echo "  Next window: rerun after Gemini free-tier daily reset (00:00 America/Los_Angeles)."
                  return 2
                fi
                wait=$(jq -r '[.error.details[]?|select((."@type"//"")|test("RetryInfo"))|.retryDelay] | .[0] // "35s"' "_work/${base}.json" 2>/dev/null | tr -dc '0-9')
                wait="${wait:-35}"; [ "$wait" -lt 35 ] && wait=35
                echo "  $file: per-minute rate 429 — backing off ${wait}s (rate retry ${attempt}/${MAX_RATE_RETRIES})"
                sleep "$wait"
              else
                echo "  $file: transient/non-429 error — retrying in 10s"
                sleep 10
              fi
              attempt=$((attempt+1))
              if [ "$attempt" -gt "${MAX_RATE_RETRIES}" ]; then
                echo "  $file: exhausted ${MAX_RATE_RETRIES} retries"; return 1
              fi
            done
          }

          mapfile -t ROWS < <(jq -r '.[] | [.file, .text] | @tsv' _work/scenes.json)
          idx=0
          for row in "${ROWS[@]}"; do
            file="${row%%$'\t'*}"; text="${row#*$'\t'}"
            if [ "$idx" -gt 0 ]; then
              echo "Pacing ${SCENE_PAUSE_SECONDS}s before $file (respect ~2/min rate)"
              sleep "${SCENE_PAUSE_SECONDS}"
            fi
            idx=$((idx+1))
            echo "=== $file ==="
            set +e; gen_scene "$file" "$text"; rc=$?; set -e
            if [ "$rc" -ne 0 ]; then
              echo "Stopping: $file did not produce audio (rc=$rc)."
              exit "$rc"
            fi
            base="${file%.wav}"
            decode_scene "$base"
            ffmpeg -y -f s16le -ar 24000 -ac 1 -i "_work/${base}.pcm" -ar 48000 "_audio_out/$file" >/tmp/ffmpeg.log 2>&1
            test -s "_audio_out/$file"
            echo "OK  $file ($(stat -c%s "_audio_out/$file") bytes)"
          done

          echo "=== Building concatenated narration track ==="
          : > _work/concat.txt
          for f in $(ls _audio_out/scene-*.wav | sort); do echo "file '$PWD/$f'" >> _work/concat.txt; done
          ffmpeg -y -f concat -safe 0 -i _work/concat.txt -ar 48000 -ac 1 _audio_out/cfc-v2-narration-full.wav >/tmp/ffmpeg-concat.log 2>&1
          echo "Full narration: $(stat -c%s _audio_out/cfc-v2-narration-full.wav) bytes"
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 _audio_out/cfc-v2-narration-full.wav || true
          ls -lh _audio_out/

      - name: Upload scene WAVs
        uses: actions/upload-artifact@v4
        with:
          name: cfc-v2-gemini-audio-${{ github.run_id }}
          path: _audio_out/
          if-no-files-found: error
          retention-days: 14
