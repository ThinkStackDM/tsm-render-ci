name: hosted-render

on:
  workflow_dispatch:
    inputs:
      title:
        description: Overlay title shown in the captured motion plate
        required: true
        default: Cashflow Compass V1
      subtitle:
        description: Short overlay subtitle for the capture plate
        required: false
        default: Locked script render verification
      script:
        description: Locked narration script to synthesize and align
        required: true
        type: string
      artifact_name:
        description: Artifact bundle name
        required: true
        default: hosted-render
      audio_url:
        description: Optional URL to a pre-generated voiceover WAV (Gemini). If set, OpenVoice TTS is skipped.
        required: false
        default: ""
  workflow_call:
    inputs:
      title:
        required: true
        type: string
      subtitle:
        required: false
        type: string
        default: Locked script render verification
      script:
        required: true
        type: string
      artifact_name:
        required: false
        type: string
        default: hosted-render
      audio_url:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/thinkstackdm/thiaaaa-render:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --shm-size=2g --user root
    steps:
      - uses: actions/checkout@v4
      - name: Hosted render (capture + OpenVoice v2 + WhisperX + MP4)
        shell: bash
        env:
          DISPLAY: ":99"
          VENV: /opt/venv
          OPENVOICE_HOME: /opt/openvoice
          PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
          SMOKE_OUT: ${{ github.workspace }}/_render_out
          RUNNER_SCRIPT_TEXT: ${{ inputs.script }}
          RUNNER_AUDIO_URL: ${{ inputs.audio_url }}
          CAPTURE_TITLE: ${{ inputs.title }}
          CAPTURE_SUBTITLE: ${{ inputs.subtitle }}
          OMP_NUM_THREADS: "4"
          OPENBLAS_NUM_THREADS: "4"
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 >/tmp/xvfb.log 2>&1 &
          for i in $(seq 1 15); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 1; done
          chmod +x infra/runner/smoke/*.sh
          infra/runner/smoke/run-smoke.sh
      - name: Shared render-gate (fail-closed; TSM-6171)
        shell: bash
        env:
          SMOKE_OUT: ${{ github.workspace }}/_render_out
        run: |
          set -euo pipefail
          # Portfolio invariant (TSM-6169 audit): no produced master may be
          # treated as reviewable/publishable until it has passed the shared
          # rejection-QA baseline. The canonical internal gate cannot run in this
          # public, tooling-only repo (it would leak internal QA) and needs a full
          # deck source pack this lane does not produce -- so this is the allowed
          # equivalent shared-gate step. It enforces the master-level shared
          # invariants (1080p/30fps, muxed narration, WhisperX >=0.85 floor,
          # master covers narration) fail-closed and records that the deck
          # source-pack gates are deferred to run-rejection-qa-gates.sh.
          python3 infra/runner/qa/shared-render-gate.py "$SMOKE_OUT"
      - name: Upload render artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-${{ github.run_id }}
          path: _render_out/
          if-no-files-found: warn
          retention-days: 7
